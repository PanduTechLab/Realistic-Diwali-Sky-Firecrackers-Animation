<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Firecrackers Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      cursor: crosshair;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    /* ==========================================================================
       REALISTIC SKY FIRECRACKERS SIMULATION
       - Deep pitch-black night sky with a few faint twinkling stars
       - Highly realistic particle dynamics:
         * Sharp Needle Chrysanthemum (Image 4 & Ref 1)
         * Imperial Chrysanthemum with multi-color pistils (Image 5)
         * Weeping Golden Willow / Kamuro with trailing embers (Ref images.jpg)
         * Multi-break delayed secondary bursts (Ref images (3).jpg)
         * Ascending rockets with fiery spark tails (Ref images (2).jpg)
         * Atmospheric drifting smoke illuminated by explosions
       - Pure cinematic visual: 0 on-screen text, 0 UI buttons/sliders
       - Full starting-to-ending choreographed display (30s+ looping)
       - Click anywhere to launch realistic custom shells
       - Procedural Web Audio API sound effects (no external files)
       ========================================================================== */

    // 1. Procedural Audio Synthesizer (Realistic launch whoosh, heavy detonation, crackles)
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.initialized = false;
      }

      init() {
        if (!this.initialized) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
            this.initialized = true;
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playLaunch(duration = 1.0) {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(950, now + duration);

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(320, now);
          filter.frequency.exponentialRampToValueAtTime(1200, now + duration);
          filter.Q.value = 5.0;

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.08, now + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {}
      }

      playDetonation(isHeavy = false) {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;

          // Deep sub-bass thump
          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(isHeavy ? 150 : 120, now);
          osc.frequency.exponentialRampToValueAtTime(28, now + (isHeavy ? 0.6 : 0.4));

          const vol = isHeavy ? 0.5 : 0.35;
          oscGain.gain.setValueAtTime(vol, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + (isHeavy ? 0.7 : 0.5));

          osc.connect(oscGain);
          oscGain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.75);

          // Sharp detonation crack (filtered noise)
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.25);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.05));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2200, now);
          filter.frequency.exponentialRampToValueAtTime(200, now + 0.25);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.38, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(now);
        } catch (e) {}
      }

      playCrackles(count = 10) {
        if (!this.ctx) return;
        try {
          for (let i = 0; i < count; i++) {
            const delay = 0.2 + Math.random() * 0.7;
            setTimeout(() => {
              if (!this.ctx) return;
              const t = this.ctx.currentTime;
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(1200 + Math.random() * 2000, t);
              g.gain.setValueAtTime(0.04 + Math.random() * 0.03, t);
              g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(t);
              osc.stop(t + 0.04);
            }, delay * 1000);
          }
        } catch (e) {}
      }
    }

    const sound = new SoundFX();

    // 2. Canvas & Sizing
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initStars();
    }
    window.addEventListener('resize', resize);

    // 3. Faint Background Stars (Few, realistic, gentle twinkling)
    let stars = [];
    function initStars() {
      stars = [];
      const count = Math.floor((width * height) / 22000);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height * 0.85,
          r: Math.random() * 1.1 + 0.3,
          alpha: Math.random() * 0.45 + 0.15,
          twinkleSpeed: 0.015 + Math.random() * 0.03,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    initStars();

    // 4. Particle Physics & Render Entities
    let rockets = [];
    let particles = [];
    let smokes = [];
    let flashes = [];

    // Ascending Rocket
    class Rocket {
      constructor(startX, startY, targetX, targetY, shellType) {
        this.x = startX;
        this.y = startY;
        this.startX = startX;
        this.startY = startY;
        this.targetX = targetX;
        this.targetY = targetY;
        this.shellType = shellType;

        const dist = Math.hypot(targetX - startX, targetY - startY);
        this.duration = Math.max(35, Math.min(60, Math.floor(dist / 11)));
        this.step = 0;
        this.trail = [];
        this.maxTrail = 14;

        // Natural flight wobble
        this.wobble = (Math.random() - 0.5) * 1.5;
        sound.playLaunch(this.duration / 55);
      }

      update() {
        this.step++;
        const progress = this.step / this.duration;
        const ease = 1 - Math.pow(1 - progress, 2.2);

        this.x = this.startX + (this.targetX - this.startX) * ease + Math.sin(progress * Math.PI * 3) * this.wobble;
        this.y = this.startY + (this.targetY - this.startY) * ease;

        this.trail.unshift({ x: this.x, y: this.y, alpha: 1.0 });
        if (this.trail.length > this.maxTrail) this.trail.pop();
        for (let i = 0; i < this.trail.length; i++) {
          this.trail[i].alpha -= 1 / this.maxTrail;
        }

        // Exhaust sparklets
        if (Math.random() < 0.75) {
          particles.push(new Particle(
            this.x + (Math.random() - 0.5) * 3,
            this.y + 3,
            (Math.random() - 0.5) * 0.8,
            Math.random() * 1.5 + 1.2,
            '#ff9d00',
            1.5,
            0.04,
            0.08,
            'spark'
          ));
        }

        if (this.step >= this.duration) {
          this.explode();
          return false;
        }
        return true;
      }

      explode() {
        createShellBurst(this.targetX, this.targetY, this.shellType);
      }

      draw(context) {
        context.save();
        context.lineWidth = 2.2;
        for (let i = 0; i < this.trail.length - 1; i++) {
          const p1 = this.trail[i];
          const p2 = this.trail[i + 1];
          context.beginPath();
          context.moveTo(p1.x, p1.y);
          context.lineTo(p2.x, p2.y);
          context.strokeStyle = `rgba(255, 170, 40, ${p1.alpha * 0.85})`;
          context.stroke();
        }

        // Bright rocket head
        context.beginPath();
        context.arc(this.x, this.y, 2.8, 0, Math.PI * 2);
        context.fillStyle = '#ffffff';
        context.shadowColor = '#ffb300';
        context.shadowBlur = 10;
        context.fill();
        context.restore();
      }
    }

    // Realistic Firework Spark
    class Particle {
      constructor(x, y, vx, vy, color, size, decay, gravity = 0.065, style = 'normal', maxTrail = 8) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.alpha = 1.0;
        this.decay = decay;
        this.gravity = gravity;
        this.drag = 0.965;
        this.style = style;
        this.trail = [];
        this.maxTrail = maxTrail;
        this.flicker = Math.random() * Math.PI * 2;
      }

      update() {
        this.trail.unshift({ x: this.x, y: this.y, alpha: this.alpha });
        if (this.trail.length > this.maxTrail) this.trail.pop();

        this.vx *= this.drag;
        this.vy *= this.drag;
        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        this.alpha -= this.decay;
        this.flicker += 0.4;

        return this.alpha > 0.02;
      }

      draw(context) {
        if (this.alpha <= 0) return;
        context.save();

        let drawAlpha = this.alpha;
        if (this.style === 'strobe') {
          drawAlpha *= (Math.sin(this.flicker) > 0.2 ? 1.0 : 0.15);
        }

        // Draw smooth trailing path
        if (this.trail.length > 1) {
          context.lineWidth = Math.max(0.6, this.size * 0.75);
          for (let i = 0; i < this.trail.length - 1; i++) {
            const p1 = this.trail[i];
            const p2 = this.trail[i + 1];
            context.beginPath();
            context.moveTo(p1.x, p1.y);
            context.lineTo(p2.x, p2.y);
            const a = (p1.alpha * drawAlpha) * (1 - i / this.trail.length);
            context.strokeStyle = this.color;
            context.globalAlpha = a;
            context.stroke();
          }
        }

        // Spark head
        context.globalAlpha = drawAlpha;
        context.beginPath();
        context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        context.fillStyle = this.color;
        if (drawAlpha > 0.4) {
          context.shadowColor = this.color;
          context.shadowBlur = this.size * 3;
        }
        context.fill();

        context.restore();
      }
    }

    // Atmospheric Smoke Haze (Illuminated by explosions)
    class SmokeCloud {
      constructor(x, y, radius, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 0.25;
        this.vy = -0.15 - Math.random() * 0.2;
        this.radius = radius;
        this.color = color;
        this.alpha = 0.22;
        this.decay = 0.0018;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.radius += 0.35;
        this.alpha -= this.decay;
        return this.alpha > 0.01;
      }

      draw(context) {
        context.save();
        const grad = context.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
        grad.addColorStop(0, `rgba(${this.color}, ${this.alpha * 0.45})`);
        grad.addColorStop(0.6, `rgba(${this.color}, ${this.alpha * 0.2})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        context.fillStyle = grad;
        context.beginPath();
        context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    // 5. Shell Types & Burst Algorithms (Directly matching user references)
    function createShellBurst(x, y, shellType = 'imperial') {
      // Sky Detonation Flash
      flashes.push({
        x: x,
        y: y,
        r: Math.min(width, height) * 0.6,
        alpha: 0.38,
        decay: 0.04
      });

      // Atmospheric smoke cloud
      smokes.push(new SmokeCloud(x, y, 40, '60, 50, 40'));

      switch (shellType) {
        // IMAGE 4 & REF 1: Needle Chrysanthemum (Sharp, straight golden needle rays with hot core)
        case 'needle': {
          sound.playDetonation(false);
          const rayCount = 180;
          for (let i = 0; i < rayCount; i++) {
            const angle = (i / rayCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.05;
            const speed = 7.5 + (i % 2 === 0 ? 1.8 : 0);
            particles.push(new Particle(
              x, y,
              Math.cos(angle) * speed,
              Math.sin(angle) * speed,
              '#ffd54f',
              1.4,
              0.020,
              0.038,
              'needle',
              12
            ));
          }

          // Blinding white-hot core stars
          for (let c = 0; c < 35; c++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = Math.random() * 2.8;
            particles.push(new Particle(
              x, y,
              Math.cos(ang) * spd,
              Math.sin(ang) * spd,
              '#ffffff',
              2.0,
              0.032,
              0.02,
              'normal',
              4
            ));
          }

          // Floating red/crimson sparks (Image 4 & Ref 1)
          for (let j = 0; j < 60; j++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = Math.random() * 3.6 + 0.6;
            particles.push(new Particle(
              x, y,
              Math.cos(ang) * spd,
              Math.sin(ang) * spd,
              '#ff1744',
              1.8,
              0.014,
              0.025,
              'strobe',
              6
            ));
          }
          sound.playCrackles(12);
          break;
        }

        // IMAGE 5 & REF IMAGES.JPG: Imperial Chrysanthemum with Multi-Color Pistils
        case 'imperial':
        default: {
          sound.playDetonation(true);

          // 1. Massive outer golden/salmon streamers (260+ particles)
          const count = 260;
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.pow(Math.random(), 0.6) * 7.6 + 1.4;
            const col = Math.random() < 0.65 ? '#ffa726' : (Math.random() < 0.5 ? '#ffcc80' : '#ff7043');
            particles.push(new Particle(
              x, y,
              Math.cos(angle) * speed,
              Math.sin(angle) * speed,
              col,
              Math.random() * 1.8 + 1.0,
              0.010 + Math.random() * 0.007,
              0.075,
              'willow',
              14
            ));
          }

          // 2. Embedded Colorful Pistil Stars (Green, Pink, Cyan - matching Image 5!)
          const pistilColors = ['#00e676', '#ff4081', '#00e5ff', '#ffd700'];
          for (let p = 0; p < 70; p++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = Math.random() * 4.2 + 0.8;
            const pCol = pistilColors[p % pistilColors.length];
            particles.push(new Particle(
              x, y,
              Math.cos(ang) * spd,
              Math.sin(ang) * spd,
              pCol,
              2.2,
              0.016,
              0.045,
              'pistil',
              8
            ));
          }

          // 3. Central white-hot flash
          for (let c = 0; c < 30; c++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = Math.random() * 2.2;
            particles.push(new Particle(
              x, y,
              Math.cos(ang) * spd,
              Math.sin(ang) * spd,
              '#ffffff',
              2.5,
              0.04,
              0.02,
              'normal',
              3
            ));
          }

          sound.playCrackles(16);
          break;
        }

        // REF IMAGES (3).JPG: Multi-Break Shell
        case 'multi': {
          sound.playDetonation(true);
          const outerCount = 180;
          for (let i = 0; i < outerCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.pow(Math.random(), 0.7) * 7.8 + 1.2;
            particles.push(new Particle(
              x, y,
              Math.cos(angle) * speed,
              Math.sin(angle) * speed,
              '#ffffff',
              1.6,
              0.009,
              0.078,
              'willow',
              16
            ));
          }

          setTimeout(() => {
            createSubBurst(x - 18, y - 12, ['#ea80fc', '#ba68c8', '#9c27b0', '#ffffff'], 75, 4.6);
          }, 240);

          setTimeout(() => {
            createSubBurst(x + 22, y + 14, ['#ffe082', '#ffd54f', '#ffb300', '#ffffff'], 75, 4.2);
          }, 460);
          break;
        }

        // REF IMAGES (2).JPG: Crackling Palm / Kamuro
        case 'palm': {
          sound.playDetonation(false);
          const arms = 14;
          for (let a = 0; a < arms; a++) {
            const baseAngle = (a / arms) * Math.PI * 2;
            const speed = 7.2;
            for (let k = 0; k < 6; k++) {
              particles.push(new Particle(
                x, y,
                Math.cos(baseAngle) * (speed - k * 0.4),
                Math.sin(baseAngle) * (speed - k * 0.4),
                '#ffb300',
                2.2,
                0.015,
                0.07,
                'willow',
                12
              ));
            }
          }
          sound.playCrackles(20);
          break;
        }
      }
    }

    function createSubBurst(x, y, colors, count, maxSpeed) {
      sound.playDetonation(false);
      flashes.push({ x: x, y: y, r: 160, alpha: 0.28, decay: 0.05 });
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * maxSpeed + 1.0;
        const col = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(
          x, y,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          col,
          2.0,
          0.016,
          0.05,
          'normal',
          6
        ));
      }
      sound.playCrackles(8);
    }

    // 6. Full 30-Second Starting-to-Ending Choreographed Show
    const SHOW_DURATION = 30.0;
    let showTime = 0.0;

    const TIMELINE = [
      // 0 - 3s: Solitary opening rocket
      { t: 1.0, x: 0.42, y: 0.26, type: 'needle' },

      // 3 - 7s: Twin ascending imperial shells with pistils (Image 5)
      { t: 3.8, x: 0.28, y: 0.28, type: 'imperial' },
      { t: 4.5, x: 0.72, y: 0.25, type: 'imperial' },

      // 7 - 11s: Multi-break and Needle Chrysanthemum
      { t: 7.2, x: 0.50, y: 0.22, type: 'needle' },
      { t: 9.0, x: 0.34, y: 0.32, type: 'multi' },
      { t: 10.4, x: 0.68, y: 0.28, type: 'palm' },

      // 11 - 16s: Sky Salvo
      { t: 12.2, x: 0.20, y: 0.26, type: 'imperial' },
      { t: 13.0, x: 0.80, y: 0.24, type: 'needle' },
      { t: 14.0, x: 0.50, y: 0.20, type: 'multi' },
      { t: 15.2, x: 0.38, y: 0.30, type: 'palm' },
      { t: 16.0, x: 0.62, y: 0.26, type: 'imperial' },

      // 16 - 20s: Pre-Finale Building Momentum
      { t: 17.5, x: 0.25, y: 0.22, type: 'needle' },
      { t: 18.2, x: 0.75, y: 0.24, type: 'multi' },
      { t: 19.0, x: 0.50, y: 0.18, type: 'imperial' },

      // 20 - 25s: GRAND FINALE (Continuous massive barrage)
      { t: 20.2, x: 0.15, y: 0.26, type: 'imperial' },
      { t: 20.6, x: 0.85, y: 0.26, type: 'imperial' },
      { t: 21.0, x: 0.35, y: 0.20, type: 'needle' },
      { t: 21.4, x: 0.65, y: 0.20, type: 'multi' },
      { t: 21.9, x: 0.50, y: 0.16, type: 'imperial' },
      { t: 22.4, x: 0.25, y: 0.28, type: 'palm' },
      { t: 22.8, x: 0.75, y: 0.28, type: 'needle' },
      { t: 23.4, x: 0.45, y: 0.20, type: 'imperial' },
      { t: 24.0, x: 0.55, y: 0.22, type: 'multi' },

      // 25 - 30s: Falling embers slowly drift & fade out
      { t: 28.5, x: null }
    ];

    let triggeredEvents = new Set();

    function launchTimelineRocket(ev) {
      const startX = width * (ev.x + (Math.random() - 0.5) * 0.12);
      const startY = height + 10;
      const targetX = width * ev.x;
      const targetY = height * ev.y;
      rockets.push(new Rocket(startX, startY, targetX, targetY, ev.type));
    }

    // 7. Interactive Launch on Click / Tap anywhere
    window.addEventListener('pointerdown', (e) => {
      sound.init();
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const types = ['needle', 'imperial', 'multi', 'palm'];
      const chosen = types[Math.floor(Math.random() * types.length)];
      const startX = clickX + (Math.random() - 0.5) * 60;
      rockets.push(new Rocket(startX, height + 10, clickX, clickY, chosen));
    });

    // 8. Main Cinematic Animation Loop
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      showTime += dt;
      if (showTime > SHOW_DURATION) {
        showTime = 0.0;
        triggeredEvents.clear();
      }

      for (let i = 0; i < TIMELINE.length; i++) {
        const ev = TIMELINE[i];
        if (showTime >= ev.t && !triggeredEvents.has(i)) {
          triggeredEvents.add(i);
          if (ev.x !== null) {
            launchTimelineRocket(ev);
          }
        }
      }

      // --- PURE PITCH-BLACK NIGHT SKY ---
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, 0, width, height);

      // Sky Detonation Flashes
      for (let i = flashes.length - 1; i >= 0; i--) {
        const f = flashes[i];
        f.alpha -= f.decay;
        if (f.alpha <= 0) {
          flashes.splice(i, 1);
          continue;
        }
        const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        grad.addColorStop(0, `rgba(255, 230, 180, ${f.alpha * 0.4})`);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
      }

      // Draw Faint Twinkling Stars
      ctx.save();
      for (const s of stars) {
        s.phase += s.twinkleSpeed;
        const starAlpha = s.alpha * (0.6 + 0.4 * Math.sin(s.phase));
        ctx.fillStyle = `rgba(255, 255, 255, ${starAlpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Atmospheric Drifting Smoke Clouds
      for (let i = smokes.length - 1; i >= 0; i--) {
        const sm = smokes[i];
        if (!sm.update()) {
          smokes.splice(i, 1);
        } else {
          sm.draw(ctx);
        }
      }

      // --- FIREWORKS RENDERING (Additive Glow) ---
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      // Update & Draw Rockets
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        if (!r.update()) {
          rockets.splice(i, 1);
        } else {
          r.draw(ctx);
        }
      }

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (!p.update()) {
          particles.splice(i, 1);
        } else {
          p.draw(ctx);
        }
      }
      ctx.restore();
    }

    // Auto-init audio on first interaction
    window.addEventListener('click', () => sound.init(), { once: true });
    window.addEventListener('touchstart', () => sound.init(), { once: true });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
